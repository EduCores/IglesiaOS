    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Aplica el tema guardado antes del primer pintado (evita flash claro/oscuro).
         Por defecto es "dark": solo se respeta "light" si el usuario lo eligió. -->
    <script>
      try {
        var t = localStorage.getItem("iglesiaos-theme");
        if (t !== "light") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <!-- Restaura rutas profundas en GitHub Pages (Fase 2: react-router).
         Si se llegó vía public/404.html, la URL real viene codificada en
         "?/ruta…": se reescribe con history.replaceState ANTES de que React
         arranque, así el router ve la ruta pedida sin recargar de nuevo.
         (Receta estándar spa-github-pages.) -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
